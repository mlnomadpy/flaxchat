[project]
name = "flaxchat"
version = "0.1.0"
description = "A minimal end-to-end LLM training harness for TPUs, built on JAX/Flax NNX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Taha Bouhsine" },
]
dependencies = [
    "jax>=0.9.0",
    "flax>=0.12.0",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.12.0",
    "datasets>=5.0.1",
    "tokenizers>=0.22.0",
    "tiktoken>=0.11.0",
    "rustbpe>=0.1.0",
    "fastapi>=0.117.1",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
    "pyarrow>=18.0.0",
    "pyyaml>=6.0",
    "filelock>=3.0",
]

[project.optional-dependencies]
tpu = ["jax[tpu]>=0.6.0", "tpuz>=0.1.0"]
kaggle = ["kgz>=0.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "build>=1.2.0",
    "matplotlib>=3.10.0",
    "ruff>=0.12.0",
    "pyright>=1.1.0",
    "pip-audit>=2.9.0",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["flaxchat/config.py", "flaxchat/pipeline.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests intentionally excluded from the quick developer loop",
    "integration: tests spanning multiple public components or processes",
    "accelerator: tests requiring a GPU or TPU backend",
]

[tool.coverage.run]
branch = true
source = ["flaxchat"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
