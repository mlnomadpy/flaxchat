[workspace]
name = "flaxchat"
version = "0.1.0"
description = "Minimal LLM training harness for TPUs built on JAX/Flax NNX"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11,<3.14"

[pypi-dependencies]
flaxchat = { path = ".", editable = true }
jax = ">=0.9.0"
jaxlib = ">=0.9.0"
flax = ">=0.12.0"
optax = ">=0.2.4"
orbax-checkpoint = ">=0.12.0"
pyarrow = ">=18.0.0"
pyyaml = ">=6.0"
filelock = ">=3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
build = ">=1.2.0"
ai-edge-litert = ">=2.1.3, <3"
datasets = ">=4.8.4, <5"
rustbpe = ">=0.1.0, <0.2"
tiktoken = ">=0.12.0, <0.13"
transformers = ">=5.5.0, <6"
huggingface-hub = ">=1.9.2, <2"
matplotlib = ">=3.10.8, <4"
tpuz = ">=0.1.11, <0.2"
nmn = ">=0.2.29"
torch = ">=2.11.0, <3"
gcsfs = ">=2026.2.0, <2027"

[tasks]
test = "pytest tests/ -v"
test-quick = "pytest tests/ -v -m 'not slow and not accelerator'"
test-coverage = "pytest tests/ -m 'not accelerator' --cov=flaxchat --cov-report=term-missing --cov-report=xml"
test-multidevice = "XLA_FLAGS=--xla_force_host_platform_device_count=8 pytest tests/test_sharding.py -v"
test-e2e = "python -m scripts.run_tinystories --smoke --output-dir artifacts/tinystories-smoke --sequence-length 32 --embedding-dim 24 --max-new-tokens 1"
build-package = "python -m build"
pretrain = "python -m scripts.pretrain"
