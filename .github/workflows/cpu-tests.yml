name: Linux validation

on:
  pull_request:
    paths:
      - "flaxchat/**"
      - "scripts/**"
      - "tasks/**"
      - "benchmarks/**"
      - "tests/**"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/cpu-tests.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [master]
    paths:
      - "flaxchat/**"
      - "scripts/**"
      - "tasks/**"
      - "benchmarks/**"
      - "tests/**"
      - "pyproject.toml"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/cpu-tests.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: linux-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          cache: true
      - name: Static checks and dependency audit
        run: |
          pixi run lint
          pixi run typecheck
          pixi run audit
      - name: Tests with coverage
        run: pixi run test-coverage
      - name: Eight-device CPU topology checks
        run: |
          pixi run test-multidevice
          pixi run pytest tests/test_checkpoint_topology.py -v
      - name: End-to-end smoke test
        run: pixi run test-e2e
      - name: Build and inspect distributions
        run: |
          pixi run build-package
          unzip -l dist/*.whl | grep -E 'flaxchat/(gpt|checkpoint|dataloader)\.py'
