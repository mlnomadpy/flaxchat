name: Kaggle accelerator tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

jobs:
  accelerator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - accelerator: tpu
            kernel_id: skywolfmo/flaxchat-tpu-full-test-suite
          - accelerator: gpu
            kernel_id: skywolfmo/flaxchat-gpu-full-test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install kaggle
      - name: Submit and monitor one bundled TPU run
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: >-
          python -m scripts.kaggle_tpu_tests
          --kernel-id "${{ matrix.kernel_id }}"
          --accelerator "${{ matrix.accelerator }}"
          --revision "${{ github.sha }}"
          --wait
          --output-dir artifacts/kaggle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-${{ matrix.accelerator }}-results
          path: artifacts/kaggle
