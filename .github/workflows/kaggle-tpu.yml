name: Kaggle accelerator tests

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Accelerator to spend quota on
        required: true
        type: choice
        options: [tpu, gpu]
        default: tpu

concurrency:
  group: kaggle-${{ inputs.accelerator }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  accelerator:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install kaggle
      - name: Submit and monitor one bundled TPU run
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kernel_id="skywolfmo/flaxchat-${{ inputs.accelerator }}-full-test-suite"
          python -m scripts.kaggle_tpu_tests \
            --kernel-id "$kernel_id" \
            --accelerator "${{ inputs.accelerator }}" \
            --revision "${{ github.sha }}" \
            --wait \
            --output-dir artifacts/kaggle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kaggle-${{ inputs.accelerator }}-results
          path: artifacts/kaggle
