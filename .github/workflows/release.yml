name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import flaxchat; print(flaxchat.__version__)"

  release:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          cache: true
      - name: Validate tag and project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          pixi run python -c
          "import os,tomllib,pathlib; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['RELEASE_TAG']==f'v{v}', (os.environ['RELEASE_TAG'],v)"
      - name: Verify tag commit is already on the validated default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin master --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/cpu-tests.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')" -gt 0
      - run: pixi run build-package
      - name: Package checkpoint, generate SBOM, and verify checksums
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment --output-file dist/flaxchat.cdx.json
          tar -czf dist/flaxchat-tinystories-v0.1.1.tar.gz examples/tinystories-v0.1.1
          sha256sum dist/* > /tmp/flaxchat-SHA256SUMS
          mv /tmp/flaxchat-SHA256SUMS dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS
      - name: Install-smoke the built wheel
        run: |
          python -m venv /tmp/flaxchat-release-smoke
          /tmp/flaxchat-release-smoke/bin/pip install dist/*.whl
          /tmp/flaxchat-release-smoke/bin/python -c "import flaxchat; print(flaxchat.__version__)"
          pixi run python -m scripts.verify_artifact examples/tinystories-v0.1.1
          pixi run python -m scripts.checkpoint_demo --artifact-dir examples/tinystories-v0.1.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: |
            dist/
            artifacts/tinystories-smoke/run_manifest.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
