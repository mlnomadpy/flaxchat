name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
      - name: Validate tag and project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          pixi run python -c
          "import os,tomllib,pathlib; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['RELEASE_TAG']==f'v{v}', (os.environ['RELEASE_TAG'],v)"
      - run: pixi run lint
      - run: pixi run typecheck
      - run: pixi run test
      - run: pixi run test-e2e
      - run: pixi run audit
      - run: pixi run build-package
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            dist/
            artifacts/tinystories-smoke/run_manifest.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
